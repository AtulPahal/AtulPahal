<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
    <style>
        .terminal { font-family: monospace; font-size: 14px; fill: #373b41; white-space: pre; }
        .title { fill: #0066cc; font-weight: bold; }
        .accent { fill: #0066cc; }
        .green { fill: #28a745; }
        .yellow { fill: #b58900; }
        .dots { fill: #b8b8b8; }
        .border { stroke: #e1e4e8; fill: #ffffff; stroke-width: 2; rx: 8; }
    </style>
    
    <rect class="border" width="598" height="298" x="1" y="1" />
    
    <!-- Decorative Terminal Window Control Buttons -->
    <circle cx="20" cy="20" r="6" fill="#ff5f56" />
    <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
    <circle cx="60" cy="20" r="6" fill="#27c93f" />
    
    <g class="terminal" transform="translate(30, 60)" xml:space="preserve">
        <!-- ASCII Grid column -->
        <text x="0" y="20" class="accent">   /\       </text>
        <text x="0" y="40" class="accent">  /  \      </text>
        <text x="0" y="60" class="accent"> /\   \     </text>
        <text x="0" y="80" class="accent">/__\   \    </text>
        <text x="0" y="100" class="accent">    \   \   </text>
        <text x="0" y="120" class="accent">     \___\  </text>
        
        <!-- System Metric Specs column -->
        <text x="160" y="20"><tspan class="title">atul</tspan>@<tspan class="title">arch-box</tspan> <tspan class="dots">----------------------------</tspan></text>
        
        <text x="160" y="45"><tspan class="yellow">OS</tspan><tspan class="dots"> ........... </tspan>Arch Linux x86_64</text>
        <text x="160" y="65"><tspan class="yellow">Host</tspan><tspan class="dots"> ...... </tspan>Apple M2 MacBook Air</text>
        <text x="160" y="85"><tspan class="yellow">Kernel</tspan><tspan class="dots"> ........... </tspan>Linux 6.x-zen</text>
        <text x="160" y="105"><tspan class="yellow">Shell</tspan><tspan class="dots"> ........... </tspan>zsh + Hyprland</text>
        <text x="160" y="125"><tspan class="yellow">Editor</tspan><tspan class="dots"> ........ </tspan>Neovim (LazyVim)</text>
        
        <!-- Live GitHub statistics payload -->
        <text x="160" y="155"><tspan class="dots">- </tspan><tspan class="title">GitHub Stats</tspan> <tspan class="dots">-----------------------------</tspan></text>
        <text x="160" y="180"><tspan class="yellow">Repos</tspan><tspan class="dots"> ......... </tspan>13</text>
        <text x="160" y="200"><tspan class="yellow">Commits</tspan><tspan class="dots"> ...... </tspan>227</text>
        <text x="160" y="220"><tspan class="yellow">Stars</tspan><tspan class="dots"> ....... </tspan>0<tspan class="dots"> | </tspan><tspan class="yellow">Followers</tspan><tspan class="dots"> ... </tspan>0</text>
    </g>
</svg>
